# CI workflow for the bizkit Go module, driven by the Makefile.
# Calls `make` targets so CI and local never drift. Action/tool versions are
# pinned to the 10x _shared/references/versions.md baseline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor = go.mod minimum (keep in sync); "stable" probes the latest release.
        go: ["1.26.10", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Test (race)
        run: make fulltest

  audit:
    name: lint + vuln + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # make audit runs gitleaks over the whole history, not one commit.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Not `stable`: the pinned golangci-lint must understand this toolchain.
          go-version-file: go.mod
      - name: Install pinned tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Audit
        run: make audit

  s3:
    name: S3 backend vs MinIO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: S3 conformance (docker compose MinIO)
        run: make test-s3

  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conventional Commits on PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/_.-]+\))?(!)?: .+'
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::commit $sha is not Conventional Commits: '$subject'"
              fail=1
            fi
          done
          exit $fail
