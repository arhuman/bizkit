# Release verification for a Go library: the module proxy serves the tag, so
# there is no artifact to build. A v* tag must pass the gate and match the top
# released version in CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tag matches CHANGELOG.md
        run: |
          set -euo pipefail
          top=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+[^]]*\]' CHANGELOG.md | sed -E 's/^## \[(.*)\]$/\1/')
          if [ "v$top" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=CHANGELOG.md::tag $GITHUB_REF_NAME does not match top CHANGELOG version v$top"
            exit 1
          fi
      - name: Install pinned tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Audit
        run: make audit
